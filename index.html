<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuySooner Prototype</title>
<style>
:root{--navy:#071f3a;--teal:#087a78;--teal-dark:#056261;--pale:#eaf6f5;--line:#d7e5e4;--text:#1f2933;--muted:#64748b;--shadow:0 24px 78px rgba(7,31,58,.11)}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at top left,rgba(8,122,120,.12),transparent 34%),linear-gradient(180deg,#fff 0,#f7fbfb 48%,#edf8f7 100%);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
#loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:var(--navy)}#loading h1{font-family:Georgia,'Times New Roman',serif;font-size:42px;letter-spacing:-.045em;margin:0 0 12px}#loading p{margin:0;color:var(--teal);font-weight:800;line-height:1.45}body.bs-loaded #loading{display:none}
.page{padding:28px 18px 44px!important}.shell{max-width:1160px!important}.card{border-radius:32px!important;box-shadow:var(--shadow)!important;border:1px solid var(--line)!important}.hero{padding:42px 46px 30px!important;background:linear-gradient(180deg,#fff 0,#f2fbfa 100%)!important}.hero h2{max-width:880px!important;font-size:clamp(34px,4.1vw,50px)!important;line-height:1.02!important;letter-spacing:-.045em!important;margin-bottom:14px!important}.hero .promise,.check-copy{max-width:830px!important;font-size:18px!important;line-height:1.48!important}.form-area,.content{padding:30px 46px 38px!important}.fact-strip{border-radius:24px!important;box-shadow:0 14px 34px rgba(7,31,58,.055)!important}.fact-card{min-height:112px!important;padding:20px!important}.section-card,.insight-card,.reality-card,.shift-card,.bridge,.ownership-panel,.bottom-line-box{border-radius:24px!important;box-shadow:0 12px 30px rgba(7,31,58,.045)!important}.fields{gap:16px!important}input,select{min-height:48px!important;border-radius:16px!important}.radio-card{border-radius:18px!important;min-height:82px!important}.actions{margin-top:28px!important;gap:14px!important}button,.primary,.secondary{min-height:48px!important;border-radius:999px!important}.primary{box-shadow:0 12px 26px rgba(8,122,120,.24)!important}.waiting-tax{border-radius:26px!important;padding:26px!important;box-shadow:0 16px 38px rgba(7,31,58,.055)!important}.waiting-tax .amount{font-size:clamp(44px,6vw,66px)!important}.two-cards,.reality-grid,.shift-grid,.ownership-grid{gap:18px!important}.choice,.footer-statement,.footer-strip,.result-line{border-radius:24px!important}img{max-width:100%;height:auto}img[src$='.jpg'],img[src$='.jpeg'],img[src$='.png']{border-radius:22px}
@media(max-width:900px){.page{padding:20px 12px 32px!important}.brand-row,.brand{display:block!important}.progress{margin-top:18px!important;text-align:left!important;min-width:0!important}.hero,.form-area,.content{padding-left:22px!important;padding-right:22px!important}.fact-strip,.fields,.radio-row,.two-cards,.choice-grid,.equation,.reality-grid,.shift-grid,.ownership-grid,.bottom-line-box{grid-template-columns:1fr!important}.field.full{grid-column:span 1!important}.market-panel,.bottom-line-left{border-left:none!important;border-right:none!important;border-top:1px solid var(--line)!important;padding-left:0!important;padding-right:0!important;padding-top:18px!important}.plus-circle,.or-circle,.symbol{position:static!important;transform:none!important;margin:0 auto!important}}
@media(max-width:560px){.card{border-radius:24px!important}.hero{padding-top:30px!important;padding-bottom:24px!important}.hero h2{font-size:31px!important}.hero .promise,.check-copy{font-size:16px!important}.fact-title{text-align:left!important}.fact-card{grid-template-columns:48px 1fr!important;min-height:auto!important}.actions{display:grid!important;grid-template-columns:1fr!important}button{width:100%!important}.confirm-panel,.bridge,.bottom-line-box,.choice{padding:20px!important}}
</style>
</head>
<body>
<div id="loading"><div><h1>BuySooner</h1><p>Loading the clean story-preserving prototype.</p></div></div>
<script>
const SOURCE_BASE='https://paulbs-glitch.github.io/BS-prototype/';
const APPROVED_TITLE='It’s never been harder to achieve the Great Australian Dream.';
const APPROVED_SUBTITLE='Answer a few questions and we’ll show what waiting may be costing you, and how BuySooner may change the equation.';
function fixRelativeUrls(root){root.querySelectorAll('[src]').forEach(el=>{const v=el.getAttribute('src');if(v&&!/^https?:|^data:|^\//i.test(v)){el.setAttribute('src',SOURCE_BASE+v.replace(/^\.\//,''));}});root.querySelectorAll('[href]').forEach(el=>{const v=el.getAttribute('href');if(v&&!/^https?:|^data:|^#|^mailto:/i.test(v)){el.setAttribute('href',SOURCE_BASE+v.replace(/^\.\//,''));}});root.querySelectorAll('[style]').forEach(el=>{el.setAttribute('style',el.getAttribute('style').replace(/url\((['"]?)(?!https?:|data:|\/)([^'")]+)\1\)/g,(m,q,path)=>`url(${q}${SOURCE_BASE}${path.replace(/^\.\//,'')}${q})`));});}
function replacePageOneCopy(root){const screen1=root.querySelector('#screen1')||root;const headings=[...screen1.querySelectorAll('h1,h2,h3')];const paras=[...screen1.querySelectorAll('p')];const oldTitle=headings.find(x=>/Ready to buy sooner\?/i.test(x.textContent||''));if(oldTitle)oldTitle.textContent=APPROVED_TITLE;const oldPromise=paras.find(x=>/BuySooner helps you bridge the deposit gap/i.test(x.textContent||''));if(oldPromise)oldPromise.textContent=APPROVED_SUBTITLE;const oldCheck=headings.find(x=>/Your 5-Minute Ownership Check/i.test(x.textContent||''));if(oldCheck)oldCheck.remove();const oldCopy=paras.find(x=>/Discover your buying power/i.test(x.textContent||''));if(oldCopy)oldCopy.remove();}
async function loadPrototype(){try{const res=await fetch(SOURCE_BASE+'index.html',{cache:'no-store'});if(!res.ok)throw new Error('Source prototype not available');const html=await res.text();const parsed=new DOMParser().parseFromString(html,'text/html');const importedStyles=[...parsed.querySelectorAll('style')].map(s=>s.textContent).join('\n');const style=document.createElement('style');style.textContent=importedStyles;document.head.prepend(style);document.title=parsed.title||document.title;parsed.querySelectorAll('script').forEach(s=>s.remove());document.body.insertAdjacentHTML('beforeend',parsed.body.innerHTML);fixRelativeUrls(document.body);replacePageOneCopy(document.body);document.body.classList.add('bs-loaded');const raw=new DOMParser().parseFromString(html,'text/html');[...raw.querySelectorAll('script')].forEach(old=>{const s=document.createElement('script');if(old.src){s.src=old.src.startsWith('http')?old.src:SOURCE_BASE+old.getAttribute('src');}else{s.textContent=old.textContent;}document.body.appendChild(s);});setTimeout(()=>replacePageOneCopy(document.body),250);}catch(e){console.error(e);document.getElementById('loading').innerHTML='<div><h1>Prototype failed to load</h1><p>The clean repo is connected, but the source prototype could not be imported.</p></div>';}}
loadPrototype();
</script>
</body>
</html>
